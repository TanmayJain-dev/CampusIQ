services:
  - type: web
    name: campusiq
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: N8N_WEBHOOK_URL
        value: https://n8n-tanmay.onrender.com/webhook/campusiq-notices
